<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#064E3B" />
    <title>Document — Tallymark</title>
    <meta name="description" content="Official business document powered by Tallymark." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Document — Tallymark" />
    <meta property="og:description" content="Official business document powered by Tallymark." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        --bg: #faf8f3;
        --paper: #fffdf9;
        --surface: #f5f1e7;
        --ink: #121513;
        --muted: #5c635d;
        --line: #e5dec9;
        --brand: #064e3b;
        --danger: #b91c1c;
        --amber: #b45309;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        line-height: 1.45;
      }
      .wrap {
        max-width: 780px;
        margin: 0 auto;
        padding: 16px 12px 40px;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 14px;
      }
      .toolbar-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .btn {
        appearance: none;
        border: 1px solid #d8ceb8;
        background: #ffffff;
        color: var(--ink);
        border-radius: 12px;
        padding: 10px 14px;
        min-height: 42px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        text-decoration: none;
      }
      .btn:hover {
        background: var(--surface);
      }
      .btn-primary {
        background: var(--brand);
        border-color: var(--brand);
        color: #ffffff;
      }
      .btn-primary:hover {
        opacity: 0.94;
        background: var(--brand);
      }
      .btn-danger-outline {
        border-color: #dc2626;
        color: #b91c1c;
        background: #ffffff;
      }
      .btn-danger-outline:hover {
        background: #fef2f2;
      }
      .btn:disabled {
        opacity: 0.6;
        cursor: wait;
      }
      .sheet {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 1px 2px rgba(18, 21, 19, 0.04);
      }
      .accent-bar {
        height: 8px;
        background: var(--brand);
      }
      .sheet-body {
        padding: 22px 18px 24px;
      }
      @media (min-width: 640px) {
        .wrap {
          padding: 28px 20px 56px;
        }
        .sheet-body {
          padding: 32px 34px 34px;
        }
      }
      .row-between {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
      }
      .biz-head {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        max-width: 440px;
      }
      .biz-logo {
        width: 48px;
        height: 48px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: #ffffff;
        object-fit: contain;
        padding: 4px;
        flex-shrink: 0;
      }
      .biz-name {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 24px;
        font-weight: 400;
        line-height: 1.15;
      }
      .meta-line {
        margin: 3px 0 0;
        font-size: 12.5px;
        color: var(--muted);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-variant-numeric: tabular-nums;
      }
      .caps {
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .doc-head-right {
        text-align: right;
        margin-left: auto;
      }
      .doc-number {
        margin: 2px 0 0;
        font-size: 18px;
        font-weight: 700;
      }
      .stamp {
        display: inline-block;
        margin-top: 10px;
        padding: 4px 12px;
        border: 2px solid currentColor;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        transform: rotate(-4deg);
      }
      .stamp-paid {
        color: #064e3b;
      }
      .stamp-part {
        color: #b45309;
      }
      .stamp-danger {
        color: #b91c1c;
      }
      .stamp-neutral {
        color: #444a45;
      }
      .divider {
        height: 1px;
        background: var(--line);
        margin: 20px 0;
      }
      .bill-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 16px;
      }
      @media (min-width: 600px) {
        .bill-grid {
          grid-template-columns: 1.2fr 1fr;
        }
      }
      .cust-name {
        margin: 4px 0 0;
        font-size: 15px;
        font-weight: 700;
      }
      .dates-box {
        display: grid;
        gap: 6px;
      }
      .kv {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        font-size: 13px;
      }
      .kv-label {
        color: var(--muted);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
      }
      th {
        text-align: left;
        background: var(--surface);
        padding: 9px 10px;
        font-size: 10.5px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        border-bottom: 1px solid var(--line);
      }
      th.num,
      td.num {
        text-align: right;
      }
      td {
        padding: 11px 10px;
        font-size: 13.5px;
        border-bottom: 1px solid #efe9da;
        vertical-align: top;
      }
      .line-desc {
        font-weight: 600;
      }
      .line-disc {
        display: block;
        margin-top: 2px;
        font-size: 11.5px;
        color: var(--muted);
      }
      .totals-wrap {
        margin-top: 18px;
        margin-left: auto;
        max-width: 310px;
        display: grid;
        gap: 7px;
      }
      .total-row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        font-size: 13.5px;
      }
      .total-row-strong {
        font-size: 15px;
        font-weight: 700;
        padding-top: 8px;
        border-top: 1px solid var(--line);
      }
      .total-row-accent {
        font-size: 16px;
        font-weight: 700;
        color: var(--brand);
      }
      .words {
        margin-top: 14px;
        font-size: 12px;
        color: var(--muted);
      }
      .card-section {
        margin-top: 22px;
        padding: 14px 16px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #faf8f3;
      }
      .bank-item {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 0;
        border-bottom: 1px solid var(--line);
      }
      .bank-item:last-child {
        border-bottom: none;
        padding-bottom: 0;
      }
      .bank-acct {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.03em;
      }
      .copy-btn {
        appearance: none;
        border: 1px solid #064e3b;
        background: #ffffff;
        color: #064e3b;
        border-radius: 10px;
        padding: 7px 12px;
        min-height: 36px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
      .copy-btn:hover {
        background: #ecfdf5;
      }
      .pay-item {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 8px 0;
        border-bottom: 1px solid var(--line);
        font-size: 13px;
      }
      .pay-item:last-child {
        border-bottom: none;
        padding-bottom: 0;
      }
      .notes-text {
        margin: 6px 0 0;
        font-size: 13px;
        color: var(--muted);
        white-space: pre-wrap;
      }
      .footer-brand {
        margin-top: 22px;
        text-align: center;
        font-size: 12px;
        color: var(--muted);
      }
      .footer-brand a {
        color: var(--brand);
        font-weight: 600;
        text-decoration: none;
      }
      .footer-brand a:hover {
        text-decoration: underline;
      }
      .state-card {
        max-width: 440px;
        margin: 64px auto;
        padding: 28px 24px;
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 16px;
        text-align: center;
      }
      .state-title {
        margin: 0 0 8px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 26px;
        font-weight: 400;
      }
      .state-desc {
        margin: 0;
        font-size: 13.5px;
        color: var(--muted);
      }
      .claim-banner {
        margin-bottom: 14px;
        padding: 13px 16px;
        border-radius: 12px;
        border: 1px solid #d9b977;
        background: #fef9ec;
        color: #713f12;
      }
      .claim-banner-neutral {
        border-color: var(--line);
        background: var(--surface);
        color: var(--ink);
      }
      .claim-banner-accepted {
        border-color: #a7f3d0;
        background: #ecfdf5;
        color: #064e3b;
      }
      .claim-banner-danger {
        border-color: #fecaca;
        background: #fef2f2;
        color: #991b1b;
      }
      .claim-banner-title {
        margin: 0;
        font-size: 13.5px;
        font-weight: 700;
      }
      .claim-banner-sub {
        margin: 3px 0 0;
        font-size: 12.5px;
        opacity: 0.9;
      }
      .claim-box {
        margin-top: 22px;
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #ffffff;
      }
      .claim-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      .claim-form {
        margin-top: 14px;
        padding-top: 14px;
        border-top: 1px solid var(--line);
        display: grid;
        gap: 12px;
      }
      .field-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
      }
      @media (min-width: 560px) {
        .field-grid {
          grid-template-columns: 1fr 1fr;
        }
      }
      .field label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        color: var(--ink);
        margin-bottom: 4px;
      }
      .field input[type="text"],
      .field input[type="number"],
      .field input[type="file"] {
        width: 100%;
        padding: 9px 11px;
        min-height: 40px;
        border: 1px solid #d8ceb8;
        border-radius: 10px;
        background: #fffdf9;
        color: var(--ink);
        font-size: 13.5px;
        font-family: inherit;
      }
      .field-hint {
        margin: 4px 0 0;
        font-size: 11.5px;
        color: var(--muted);
      }
      .form-err {
        margin: 0;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid #fecaca;
        background: #fef2f2;
        color: #991b1b;
        font-size: 12.5px;
      }
      .hp-field {
        position: absolute;
        left: -9999px;
        width: 1px;
        height: 1px;
        opacity: 0;
        pointer-events: none;
      }
      @media print {
        body {
          background: #ffffff;
        }
        .no-print {
          display: none !important;
        }
        .wrap {
          padding: 0;
          max-width: none;
        }
        .sheet {
          border: none;
          border-radius: 0;
          box-shadow: none;
        }
      }
    </style>
  </head>
  <body>
    <main id="app" class="wrap" aria-live="polite">
      <div class="state-card">
        <p class="state-title">Loading document</p>
        <p class="state-desc">Opening document details…</p>
      </div>
    </main>
    <script type="module" src="/src/public-doc/main.ts"></script>
  </body>
</html>
