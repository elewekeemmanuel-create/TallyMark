<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#064E3B" />
    <title>Document — Tallymark</title>
    <meta name="description" content="Official business document powered by Tallymark." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Document — Tallymark" />
    <meta property="og:description" content="Official business document powered by Tallymark." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f5f7f8;
        --paper: #ffffff;
        --surface-primary: #ffffff;
        --surface: #f5f7f8;
        --ink: #111827;
        --muted: #6b7280;
        --line: #e5e7eb;
        --brand: #064e3b;
        --brand-hover: #04392b;
        --brand-bright: #047857;
        --mint: #6ee7b7;
        --mint-soft: #ecfdf5;
        --mint-border: #a7f3d0;
        --danger: #b91c1c;
        --amber: #b45309;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Poppins", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        line-height: 1.5;
      }
      .wrap {
        max-width: 780px;
        margin: 0 auto;
        padding: 16px 12px 44px;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 16px;
      }
      .toolbar-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .btn {
        appearance: none;
        border: 1px solid var(--line);
        background: #ffffff;
        color: var(--ink);
        border-radius: 10px;
        padding: 10px 16px;
        min-height: 42px;
        font-size: 13px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        text-decoration: none;
        transition: background-color 0.15s ease, opacity 0.15s ease;
      }
      .btn:hover {
        background: var(--surface);
      }
      .btn-primary {
        background: var(--brand);
        border-color: var(--brand);
        color: #ffffff;
      }
      .btn-primary:hover {
        background: #04392b;
        border-color: #04392b;
      }
      .btn-danger-outline {
        border-color: #fecaca;
        color: #b91c1c;
        background: #ffffff;
      }
      .btn-danger-outline:hover {
        background: #fef2f2;
      }
      .btn:disabled {
        opacity: 0.6;
        cursor: wait;
      }
      .sheet {
        background: var(--paper);
        border: 1px solid rgba(17, 24, 39, 0.06);
        border-radius: 24px;
        overflow: hidden;
        box-shadow: 0 16px 48px -24px rgba(17, 24, 39, 0.12);
      }
      .accent-bar {
        height: 6px;
        background: var(--brand);
      }
      .sheet-body {
        padding: 24px 20px 26px;
      }
      @media (min-width: 640px) {
        .wrap {
          padding: 32px 20px 56px;
        }
        .sheet-body {
          padding: 34px 36px 36px;
        }
      }
      .row-between {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
      }
      .biz-head {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        max-width: 440px;
      }
      .biz-logo {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: #ffffff;
        object-fit: contain;
        padding: 4px;
        flex-shrink: 0;
      }
      .biz-name {
        margin: 0;
        font-family: "Poppins", -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1.2;
      }
      .meta-line {
        margin: 3px 0 0;
        font-size: 12.5px;
        color: var(--muted);
      }
      .mono {
        font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-variant-numeric: tabular-nums;
      }
      .caps {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.03em;
        color: var(--muted);
      }
      .doc-head-right {
        text-align: right;
        margin-left: auto;
      }
      .doc-number {
        margin: 2px 0 0;
        font-size: 18px;
        font-weight: 600;
      }
      .stamp {
        display: inline-block;
        margin-top: 10px;
        padding: 4px 12px;
        border: 1.5px solid currentColor;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .stamp-paid {
        color: #064e3b;
        background: #ecfdf5;
      }
      .stamp-part {
        color: #b45309;
        background: #fffbeb;
      }
      .stamp-danger {
        color: #b91c1c;
        background: #fef2f2;
      }
      .stamp-neutral {
        color: #374151;
        background: #f4f6f8;
      }
      .divider {
        height: 1px;
        background: var(--line);
        margin: 20px 0;
      }
      .bill-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 16px;
      }
      @media (min-width: 600px) {
        .bill-grid {
          grid-template-columns: 1.2fr 1fr;
        }
      }
      .cust-name {
        margin: 4px 0 0;
        font-size: 15px;
        font-weight: 600;
      }
      .dates-box {
        display: grid;
        gap: 6px;
      }
      .kv {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        font-size: 13px;
      }
      .kv-label {
        color: var(--muted);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
      }
      th {
        text-align: left;
        background: var(--surface);
        padding: 10px 10px;
        font-size: 11px;
        font-weight: 600;
        color: var(--muted);
        border-bottom: 1px solid var(--line);
      }
      th.num,
      td.num {
        text-align: right;
      }
      td {
        padding: 12px 10px;
        font-size: 13.5px;
        border-bottom: 1px solid #f1f5f9;
        vertical-align: top;
      }
      .line-desc {
        font-weight: 600;
      }
      .line-disc {
        display: block;
        margin-top: 2px;
        font-size: 11.5px;
        color: var(--muted);
      }
      .totals-wrap {
        margin-top: 18px;
        margin-left: auto;
        max-width: 310px;
        display: grid;
        gap: 7px;
      }
      .total-row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        font-size: 13.5px;
      }
      .total-row-strong {
        font-size: 15px;
        font-weight: 600;
        padding-top: 8px;
        border-top: 1px solid var(--line);
      }
      .total-row-accent {
        font-size: 16px;
        font-weight: 600;
        color: var(--brand);
      }
      .words {
        margin-top: 14px;
        font-size: 12px;
        color: var(--muted);
      }
      .card-section {
        margin-top: 22px;
        padding: 16px 18px;
        border: 1px solid transparent;
        border-radius: 18px;
        background: var(--surface);
      }
      .bank-item {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 0;
        border-bottom: 1px solid var(--line);
      }
      .bank-item:last-child {
        border-bottom: none;
        padding-bottom: 0;
      }
      .bank-acct {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      .copy-btn {
        appearance: none;
        border: none;
        background: #ecfdf5;
        color: #064e3b;
        border-radius: 10px;
        padding: 7px 14px;
        min-height: 36px;
        font-size: 12px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
      }
      .copy-btn:hover {
        background: #d1fae5;
      }
      .pay-item {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 8px 0;
        border-bottom: 1px solid var(--line);
        font-size: 13px;
      }
      .pay-item:last-child {
        border-bottom: none;
        padding-bottom: 0;
      }
      .notes-text {
        margin: 6px 0 0;
        font-size: 13px;
        color: var(--muted);
        white-space: pre-wrap;
      }
      .footer-brand {
        margin-top: 24px;
        text-align: center;
        font-size: 12px;
        color: var(--muted);
      }
      .footer-brand a {
        color: var(--brand);
        font-weight: 600;
        text-decoration: none;
      }
      .footer-brand a:hover {
        text-decoration: underline;
      }
      .state-card {
        max-width: 440px;
        margin: 64px auto;
        padding: 32px 28px;
        background: var(--paper);
        border-radius: 24px;
        text-align: center;
        box-shadow: 0 16px 48px -24px rgba(17, 24, 39, 0.12);
      }
      .state-title {
        margin: 0 0 8px;
        font-family: "Poppins", -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .state-desc {
        margin: 0;
        font-size: 14px;
        color: var(--muted);
      }
      .claim-banner {
        margin-bottom: 14px;
        padding: 14px 18px;
        border-radius: 18px;
        border: 1px solid #fde68a;
        background: #fffbeb;
        color: #92400e;
      }
      .claim-banner-neutral {
        border-color: var(--line);
        background: #ffffff;
        color: var(--ink);
      }
      .claim-banner-accepted {
        border-color: #a7f3d0;
        background: #ecfdf5;
        color: #064e3b;
      }
      .claim-banner-danger {
        border-color: #fecaca;
        background: #fef2f2;
        color: #991b1b;
      }
      .claim-banner-title {
        margin: 0;
        font-size: 13.5px;
        font-weight: 600;
      }
      .claim-banner-sub {
        margin: 3px 0 0;
        font-size: 12.5px;
        opacity: 0.9;
      }
      .claim-box {
        margin-top: 22px;
        padding: 18px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: #ffffff;
      }
      .claim-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      .claim-form {
        margin-top: 14px;
        padding-top: 14px;
        border-top: 1px solid var(--line);
        display: grid;
        gap: 12px;
      }
      .field-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
      }
      @media (min-width: 560px) {
        .field-grid {
          grid-template-columns: 1fr 1fr;
        }
      }
      .field label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        color: var(--ink);
        margin-bottom: 4px;
      }
      .field input[type="text"],
      .field input[type="number"],
      .field input[type="file"] {
        width: 100%;
        padding: 9px 12px;
        min-height: 42px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #f9fafb;
        color: var(--ink);
        font-size: 13.5px;
        font-family: inherit;
      }
      .field-hint {
        margin: 4px 0 0;
        font-size: 11.5px;
        color: var(--muted);
      }
      .form-err {
        margin: 0;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid #fecaca;
        background: #fef2f2;
        color: #991b1b;
        font-size: 12.5px;
      }
      .hp-field {
        position: absolute;
        left: -9999px;
        width: 1px;
        height: 1px;
        opacity: 0;
        pointer-events: none;
      }
      @media print {
        @page {
          size: A4 portrait;
          margin: 8mm;
        }
        html,
        body {
          height: auto !important;
          background: #ffffff !important;
          line-height: 1.3 !important;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }
        .no-print {
          display: none !important;
        }
        .wrap {
          padding: 0 !important;
          max-width: none !important;
        }
        .sheet {
          border: none !important;
          border-radius: 0 !important;
          box-shadow: none !important;
        }
        .accent-bar {
          height: 5px !important;
        }
        .sheet-body {
          padding: 12px 14px 10px !important;
        }
        .biz-logo {
          width: 36px !important;
          height: 36px !important;
        }
        .biz-name {
          font-size: 19px !important;
        }
        .meta-line {
          font-size: 10.5px !important;
          margin-top: 1px !important;
        }
        .doc-number {
          font-size: 15px !important;
        }
        .stamp {
          margin-top: 5px !important;
          padding: 2px 8px !important;
          font-size: 10px !important;
        }
        .divider {
          margin: 10px 0 !important;
        }
        .bill-grid {
          grid-template-columns: 1.2fr 1fr !important;
          gap: 10px !important;
        }
        .cust-name {
          font-size: 12.5px !important;
          margin-top: 2px !important;
        }
        .dates-box {
          gap: 2px !important;
        }
        .kv {
          font-size: 10.5px !important;
        }
        table {
          margin-top: 10px !important;
        }
        th {
          padding: 5px 7px !important;
          font-size: 9px !important;
        }
        td {
          padding: 5px 7px !important;
          font-size: 10.5px !important;
        }
        tr {
          break-inside: avoid;
        }
        .line-disc {
          font-size: 9.5px !important;
        }
        .totals-wrap {
          margin-top: 10px !important;
          max-width: 260px !important;
          gap: 3px !important;
          break-inside: avoid;
        }
        .total-row {
          font-size: 10.5px !important;
        }
        .total-row-strong {
          font-size: 12px !important;
          padding-top: 5px !important;
        }
        .total-row-accent {
          font-size: 12.5px !important;
        }
        .words {
          margin-top: 8px !important;
          font-size: 10px !important;
        }
        .card-section {
          margin-top: 10px !important;
          padding: 8px 10px !important;
          border-radius: 8px !important;
          break-inside: avoid;
        }
        .bank-item {
          padding: 4px 0 !important;
        }
        .bank-acct {
          font-size: 11.5px !important;
        }
        .pay-item {
          padding: 4px 0 !important;
          font-size: 10.5px !important;
        }
        .notes-text {
          margin-top: 3px !important;
          font-size: 10.5px !important;
        }
        .footer-brand {
          margin-top: 10px !important;
          font-size: 9.5px !important;
        }
      }
    </style>
  </head>
  <body>
    <main id="app" class="wrap" aria-live="polite">
      <div class="state-card">
        <p class="state-title">Loading document</p>
        <p class="state-desc">Opening document details…</p>
      </div>
    </main>
    <script type="module" src="/src/public-doc/main.ts"></script>
  </body>
</html>
